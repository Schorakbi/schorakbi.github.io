<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Lost in space · Mehdi Ziadi</title>
  <script>try{var s=localStorage.getItem("theme")}catch(e){}document.documentElement.dataset.theme=s||(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark")</script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='7' fill='%23ff7a45'/%3E%3Cellipse cx='16' cy='16' rx='14' ry='5' fill='none' stroke='%23ff7a45' stroke-width='1.6' transform='rotate(-20 16 16)'/%3E%3C/svg%3E">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <!-- Absolute paths: GitHub Pages serves this page at any missing URL, at any depth. -->
  <link rel="stylesheet" href="/style.css">
  <style>
    .lost { min-height: 100vh; display: grid; place-content: center; text-align: center; padding: 24px; }
    .lost .code { font: 400 clamp(110px, 22vw, 220px)/.9 var(--serif); margin: 0; color: var(--text); }
    .lost .code em { color: var(--accent); }
    .lost h1 { font-size: clamp(30px, 4.6vw, 48px); margin: 18px 0 10px; }
    .lost p { color: var(--muted); margin: 0 auto 30px; max-width: 42ch; }
    .lost .row-btns { justify-content: center; }
  </style>
</head>
<body>
  <canvas id="sky" aria-hidden="true"></canvas>
  <main class="lost">
    <p class="code" aria-hidden="true">4<em>0</em>4</p>
    <h1 data-i18n="h">Lost in space</h1>
    <p data-i18n="p">This page drifted out of orbit. The rest of the site is right where you left it.</p>
    <div class="row-btns">
      <a class="btn" href="/" data-i18n="home">Back to home</a>
      <a class="btn line" href="/cv.html" data-i18n="cv">Read the CV</a>
    </div>
  </main>
  <script src="/common.js"></script>
  <script>
    // Only the starfield and the language from common.js; this page has no controls.
    const D = { en: { h: "Lost in space", p: "This page drifted out of orbit. The rest of the site is right where you left it.", home: "Back to home", cv: "Read the CV" },
                fr: { h: "Perdu dans l'espace", p: "Cette page est sortie de son orbite. Le reste du site est toujours là.", home: "Retour à l'accueil", cv: "Lire le CV" } };
    applyLang(D);
    document.title = (lang === "fr" ? "Perdu dans l'espace" : "Lost in space") + " · Mehdi Ziadi";
    sky.toggle();
  </script>
</body>
</html>
